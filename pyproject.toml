[project]
name = "bankai"
version = "0.1.0"
description = "Production-grade multi-agent banking assistant (reference implementation)"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.8",
  "redis>=5.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bankai*"]

[tool.setuptools.package-data]
bankai = ["prompts/*.md", "api/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["canary: prompt-injection canaries, re-run on every change"]
filterwarnings = ["ignore::DeprecationWarning"]
