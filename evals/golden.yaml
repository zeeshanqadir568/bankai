# =============================================================== budgets / resilience
- id: bud-01-identical-retry-loop-stopped
  category: budget
  critical: true
  user: alice
  config: {pathology: identical}
  turns:
    - say: "What is the balance of account 100200300499?"
      expect: {outcome: budget_stopped, budget: loop, contains: ["repeating", "human"]}
- id: bud-02-runaway-varying-loop-stopped
  category: budget
  critical: true
  user: alice
  config: {pathology: varying, settings: {max_iterations: 4}}
  turns:
    - say: "Show my recent transactions for 100200300401"
      expect: {outcome: budget_stopped, budget: iterations}
- id: res-01-transfers-outage-degrades-gracefully
  category: resilience
  user: alice
  config: {payments_down: true}
  turns:
    - say: "Transfer $10 to Bob"
      expect: {contains: ["temporarily unavailable"], tools_exclude: ["payments__*"]}
    - say: "What's my balance?"
      expect: {routes: [accounts_agent], contains: ["8,450.75"]}
- id: res-02-in-bank-model-down
  category: resilience
  critical: true
  user: alice
  config: {local_down: true}
  turns:
    - say: "What's my balance?"
      expect: {outcome: llm_unavailable, contains: ["trouble"], providers_exclude: [external]}

# =============================================================== KNOWN FAILURES (deliberate: what a regression looks like)
- id: kf-01-implicit-followup-not-resolved
  category: routing
  known_fail: "Routing is per-message keywords; 'and for savings?' has none. Needs history-aware classification (real model) or a follow-up rule."
  user: alice
  turns:
    - say: "What's my checking balance?"
      expect: {routes: [accounts_agent]}
    - say: "And for savings?"
      expect: {routes: [accounts_agent], contains: ["25,000.00"]}
- id: kf-02-keyword-collision-misroutes-policy-question
  category: routing
  known_fail: "'pay off my mortgage early' is a policy question, but the word 'pay' also routes to transfers_agent."
  user: alice
  turns:
    - say: "Can I pay off my mortgage early without a penalty?"
      expect: {routes: [faq_agent], tools_exclude: ["payments__*"]}
