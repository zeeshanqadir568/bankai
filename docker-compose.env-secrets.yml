# Alternative secret source for hosts where bind-mounting ./secrets is not possible (sandboxed/virtualised paths, some CI):
#   JWT_SIGNING_KEY=... MCP_TOKEN_KEY=... DB_PASSWORD=... ANTHROPIC_API_KEY=" " \
#     docker compose -f docker-compose.yml -f docker-compose.env-secrets.yml up -d
# (`make up-env` does this by reading ./secrets). The containers still see plain files under /run/secrets.
secrets:
  jwt_signing_key: !override {environment: JWT_SIGNING_KEY}
  mcp_token_key: !override {environment: MCP_TOKEN_KEY}
  db_password: !override {environment: DB_PASSWORD}
  anthropic_api_key: !override {environment: ANTHROPIC_API_KEY}
