# Bank AI assistant - local/dev topology. `make up` (or `docker compose up -d --build`).
#   UI            http://localhost:${API_PORT:-8080}/   staff console /staff   (set API_PORT if 8080 is taken)
#   Jaeger traces http://localhost:16686
# Secrets are files under ./secrets (generated by `make secrets`), mounted at /run/secrets - never env vars, never in git.

x-app: &app
  build: .
  image: bankai:latest
  restart: unless-stopped
  extra_hosts: ["host.docker.internal:host-gateway"]
  environment: &env
    ENV: ${ENV:-dev}
    DATABASE_URL: postgresql://bank@postgres:5432/bank        # password comes from the db_password secret
    REDIS_URL: redis://redis:6379/0
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    LOCAL_LLM_PROVIDER: ${LOCAL_LLM_PROVIDER:-mock}           # mock | ollama  (ollama: docker compose --profile local-llm up)
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}   # Ollama running on YOUR machine (or the compose 'ollama' service)
    LOCAL_MODEL: ${LOCAL_MODEL:-qwen3:8b}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}          # a local 8B model needs longer than a hosted API
    MAX_ITERATIONS: ${MAX_ITERATIONS:-8}
    EXTERNAL_LLM_PROVIDER: ${EXTERNAL_LLM_PROVIDER:-mock}     # mock | anthropic (needs secrets/anthropic_api_key)
    EXTERNAL_MODEL: ${EXTERNAL_MODEL:-claude-sonnet-5}
    EXTERNAL_LLM_ENABLED: ${EXTERNAL_LLM_ENABLED:-true}       # false = kill switch: nothing ever leaves the bank
    APPROVAL_TIMEOUT_SECONDS: ${APPROVAL_TIMEOUT_SECONDS:-900}
  secrets: [jwt_signing_key, mcp_token_key, db_password, anthropic_api_key]

x-mcp: &mcp
  <<: *app
  depends_on:
    init: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bank
      POSTGRES_DB: bank
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686"]

  init:                       # one-shot: create tables, seed demo bank (ENV=dev only)
    <<: *app
    restart: "no"
    command: ["python", "-m", "bankai.cli", "init"]
    depends_on:
      postgres: {condition: service_healthy}

  accounts-mcp:
    <<: *mcp
    command: ["python", "-m", "bankai.servers.run", "accounts"]
    environment: {<<: *env, SERVICE_NAME: accounts-mcp, PORT: "8000"}
  payments-mcp:
    <<: *mcp
    command: ["python", "-m", "bankai.servers.run", "payments"]
    environment: {<<: *env, SERVICE_NAME: payments-mcp, PORT: "8000"}
  crm-mcp:
    <<: *mcp
    command: ["python", "-m", "bankai.servers.run", "crm"]
    environment: {<<: *env, SERVICE_NAME: crm-mcp, PORT: "8000"}
  knowledge-mcp:
    <<: *mcp
    command: ["python", "-m", "bankai.servers.run", "knowledge"]
    environment: {<<: *env, SERVICE_NAME: knowledge-mcp, PORT: "8000"}

  api:
    <<: *app
    ports: ["${API_PORT:-8080}:8080"]
    environment:
      <<: *env
      SERVICE_NAME: bankai-api
      RUN_WORKERS_IN_API: "false"
      MCP_ACCOUNTS_URL: http://accounts-mcp:8000/mcp
      MCP_PAYMENTS_URL: http://payments-mcp:8000/mcp
      MCP_CRM_URL: http://crm-mcp:8000/mcp
      MCP_KNOWLEDGE_URL: http://knowledge-mcp:8000/mcp
    # Deliberately NOT gated on the MCP servers: if payments-mcp is down the API still starts and the other agents work
    # (the gateway re-discovers tools as servers come back; /readyz reports "degraded").
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["python", "-m", "bankai.worker"]
    environment:
      <<: *env
      SERVICE_NAME: bankai-worker
      HEALTH_PORT: "8090"
      MCP_ACCOUNTS_URL: http://accounts-mcp:8000/mcp
      MCP_PAYMENTS_URL: http://payments-mcp:8000/mcp
      MCP_CRM_URL: http://crm-mcp:8000/mcp
      MCP_KNOWLEDGE_URL: http://knowledge-mcp:8000/mcp
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ollama:                     # optional in-bank model:  docker compose --profile local-llm up -d  (then LOCAL_LLM_PROVIDER=ollama)
    image: ollama/ollama:latest
    profiles: [local-llm]
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

volumes: {pgdata: {}, redisdata: {}, ollama: {}}

secrets:
  jwt_signing_key: {file: ./secrets/jwt_signing_key}
  mcp_token_key: {file: ./secrets/mcp_token_key}
  db_password: {file: ./secrets/db_password}
  anthropic_api_key: {file: ./secrets/anthropic_api_key}
